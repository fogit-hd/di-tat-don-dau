<!doctype html><html lang="vi"><meta charset="utf-8"><title>Bản duyệt khung SVG</title><style>*{box-sizing:border-box}body{margin:0;padding:36px;background:#67131c;color:#f6dfae;font:18px/1.45 Cambria,Georgia,serif}h1{font-size:30px;margin:0 0 24px}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}section{border:2px solid #b68a42;padding:28px;border-radius:10px}section.paper{background:#f5e6c9;color:#4b2616}section.wine{background:#410f19}h2{font-size:25px;margin:0 0 20px}label{display:block;margin:0 0 20px}.field{position:relative;margin-top:7px;height:56px;border:0 solid transparent;border-image-slice:16 fill;border-image-width:16px;border-image-repeat:stretch}.field img{position:absolute;width:100%;height:100%;inset:0}.field input{position:absolute;inset:0;width:100%;height:100%;border:0;outline:0;background:transparent;padding:10px 19px;font:18px/1.6 Cambria,Georgia,serif;color:#452719;box-shadow:none;min-width:0}.wine input{color:#fbe8c7}input:disabled{opacity:.55}footer{margin-top:24px;font-size:16px;color:#f0d7a4}@media(max-width:700px){main{grid-template-columns:1fr}body{padding:16px}}</style><h1>Khung nhập liệu SVG · bản duyệt</h1><main><section class="paper"><h2>Nền giấy</h2><label>Bình thường<div class="field" style="border-image-source:url(field-svg/field-paper-normal.svg)"><input aria-label="Bình thường" value="Nhóm trình chiếu" readonly /></div></label><label>Đang chọn<div class="field" style="border-image-source:url(field-svg/field-paper-focus.svg)"><input aria-label="Đang chọn" value="Nhóm trình chiếu" readonly /></div></label><label>Lỗi<div class="field" style="border-image-source:url(field-svg/field-paper-error.svg)"><input aria-label="Lỗi" value="Nhóm trình chiếu" readonly /></div></label><label>Vô hiệu hóa<div class="field" style="border-image-source:url(field-svg/field-paper-disabled.svg)"><input aria-label="Vô hiệu hóa" value="Nhóm trình chiếu" readonly disabled/></div></label></section><section class="wine"><h2>Nền đỏ rượu</h2><label>Bình thường<div class="field" style="border-image-source:url(field-svg/field-wine-normal.svg)"><input aria-label="Bình thường" value="Nhóm trình chiếu" readonly /></div></label><label>Đang chọn<div class="field" style="border-image-source:url(field-svg/field-wine-focus.svg)"><input aria-label="Đang chọn" value="Nhóm trình chiếu" readonly /></div></label><label>Lỗi<div class="field" style="border-image-source:url(field-svg/field-wine-error.svg)"><input aria-label="Lỗi" value="Nhóm trình chiếu" readonly /></div></label><label>Vô hiệu hóa<div class="field" style="border-image-source:url(field-svg/field-wine-disabled.svg)"><input aria-label="Vô hiệu hóa" value="Nhóm trình chiếu" readonly disabled/></div></label></section></main><footer>Asset SVG thật, chưa áp vào ứng dụng. Góc cố định 16px khi triển khai nine-slice; nội dung ô nhập tách khỏi khung.</footer></html>
